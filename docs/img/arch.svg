<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#8b98ac"/></marker></defs>
<rect width="760" height="470" fill="#eef1f5"/>
<rect width="760" height="40" fill="#0f1b2d"/><text x="16" y="26" font-size="14" font-weight="700" fill="#fff">XDP<tspan fill="#d9411e">-ban</tspan></text>
<text x="30" y="70" font-size="18" font-weight="600" fill="#1a2433">整体架构 · Architecture</text>
<text x="30" y="92" font-size="12" fill="#67748a">一个静态二进制同时跑控制面和执行面,外部依赖只有一个 SQLite 文件和一块网卡</text>

<!-- 入口 -->
<rect x="26" y="144" width="126" height="124" rx="4" fill="#fff" stroke="#d5dae3"/>
<rect x="26" y="144" width="126" height="26" rx="4" fill="#f7f9fc"/><text x="38" y="162" font-size="11" font-weight="600" fill="#1a2433">入口</text>
<text x="38" y="192" font-size="12" fill="#1a2433">运维浏览器</text><text x="38" y="208" font-size="10" fill="#67748a">会话 + CSRF token</text>
<text x="38" y="234" font-size="12" fill="#1a2433">审批人邮件</text><text x="38" y="250" font-size="10" fill="#67748a">一次性 token 链接</text>

<!-- 用户态 -->
<rect x="166" y="112" width="400" height="184" rx="4" fill="#f7f9fc" stroke="#c3ccd9"/>
<text x="178" y="132" font-size="12" font-weight="600" fill="#1a2433">单一二进制 · xdp-ban</text>
<rect x="178" y="148" width="180" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="190" y="170" font-size="12" font-weight="600" fill="#1a2433">gin HTTP 控制面</text><text x="190" y="189" font-size="10" fill="#67748a">审批 · 查询 · 审计 · RBAC</text>
<rect x="374" y="148" width="180" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="386" y="170" font-size="12" font-weight="600" fill="#1a2433">SQLite (WAL)</text><text x="386" y="189" font-size="10" fill="#67748a">唯一状态源 · 审计只追加</text>
<rect x="178" y="222" width="180" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="190" y="244" font-size="12" font-weight="600" fill="#1a2433">executor loop · 5s</text><text x="190" y="263" font-size="10" fill="#67748a">pending dispatch → 写 map</text>
<rect x="374" y="222" width="180" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="386" y="244" font-size="12" font-weight="600" fill="#1a2433">reconcile · 5min</text><text x="386" y="263" font-size="10" fill="#67748a">acked ↔ map 回读核对</text>

<!-- 外部依赖 -->
<rect x="586" y="148" width="148" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="598" y="170" font-size="12" font-weight="600" fill="#1a2433">SMTP</text><text x="598" y="189" font-size="10" fill="#67748a">审批通知邮件</text>
<rect x="586" y="222" width="148" height="56" rx="3" fill="#fff" stroke="#d5dae3"/><text x="598" y="244" font-size="12" font-weight="600" fill="#1a2433">ASN / CIDR 前缀库</text><text x="598" y="263" font-size="10" fill="#67748a">启动时载入内存</text>

<g stroke="#8b98ac" stroke-width="1.4" fill="none" marker-end="url(#ar)">
<path d="M152,176 L174,176"/>
<path d="M358,176 L370,176"/>
<path d="M464,204 L464,213 L268,213 L268,219"/>
<path d="M268,278 L268,327"/>
<path d="M464,328 L464,281"/>
<path d="M566,176 L582,176"/>
<path d="M584,250 L568,250"/>
</g>
<text x="276" y="316" font-size="10" fill="#67748a">写 map(BPF_ANY)</text>
<text x="472" y="316" font-size="10" fill="#67748a">回读 → drift_detected 审计</text>

<!-- 内核态 -->
<rect x="26" y="330" width="708" height="110" rx="4" fill="#1e3050"/>
<text x="38" y="351" font-size="12" font-weight="600" fill="#fff">内核态 · generic(SKB) XDP —— 挂在业务网卡,不依赖驱动或硬件 offload</text>
<g font-size="11">
<rect x="38" y="360" width="164" height="44" rx="3" fill="#16263c" stroke="#2c4266"/><text x="50" y="378" font-weight="600" fill="#fff">src_ban_global</text><text x="50" y="395" font-size="10" fill="#8fa2c0">LPM_TRIE · key 8B</text>
<rect x="214" y="360" width="164" height="44" rx="3" fill="#16263c" stroke="#2c4266"/><text x="226" y="378" font-weight="600" fill="#fff">target_hosts</text><text x="226" y="395" font-size="10" fill="#8fa2c0">HASH · key 4B</text>
<rect x="390" y="360" width="164" height="44" rx="3" fill="#16263c" stroke="#2c4266"/><text x="402" y="378" font-weight="600" fill="#fff">src_ban</text><text x="402" y="395" font-size="10" fill="#8fa2c0">LPM_TRIE · key 12B</text>
<rect x="566" y="360" width="164" height="44" rx="3" fill="#16263c" stroke="#2c4266"/><text x="578" y="378" font-weight="600" fill="#fff">counters</text><text x="578" y="395" font-size="10" fill="#8fa2c0">PERCPU_ARRAY · 4 项</text>
</g>
<text x="38" y="425" font-size="10" fill="#8fa2c0">ban_value 24B = expires_at(ktime) + hits + rule_id;TTL 到期在内核里比较 ktime 判定,控制面没有 sweeper</text>
<text x="30" y="459" font-size="10" fill="#67748a">关停顺序:先停 HTTP 收敛在途请求 → 停两个 loop → 卸载 XDP。CGO_ENABLED=0 静态链接,HTML 模板与 favicon 都 //go:embed 进二进制。</text>
</svg>
